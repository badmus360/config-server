server:
  port: 7899

spring:
  application:
    name: gateway

  threads:
    virtual:
      enabled: true

  main:
    web-application-type: reactive

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  server:
    peer-node-read-timeout-ms: 10000
    peer-node-connect-timeout-ms: 5000
    enable-self-preservation: false
  client:
    service-url:
      defaultZone: http://${eureka.security.username}:${eureka.security.password}@localhost:${server.port}/eureka/
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    appname: gateway
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45
    hostname: localhost
    prefer-ip-address: false
  security:
    username: switchUser
    password: password123

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  threads:
    virtual:
      enabled: true

app:
  route:
    transfer: http://localhost:8099
    user: http://localhost:8096
    identity: http://localhost:8091
    bills: http://localhost:8090

  security:
    api-key: secure-key-12345